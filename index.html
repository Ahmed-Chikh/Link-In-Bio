<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Link In Bio</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    </head>
    <body>
        <form>
            <header>
                <h1>Link In Bio</h1>
                <img src="https://static.vecteezy.com/system/resources/previews/036/280/651/original/default-avatar-profile-icon-social-media-user-image-gray-avatar-icon-blank-profile-silhouette-illustration-vector.jpg" alt="your image goes here" class="image">
                <div class="name">
                    <input type="text" required placeholder="Name" id="name">
                    <label for="name" id="nameLabel">Name</label>
                </div>
                <div class="number">
                    <input required type="tel" id="number" placeholder="Number" pattern="[0-9]*">
                    <label for="number" id="numberLabel">Number</label>
                </div>
                <div class="email">
                <input required type="email" id="email" placeholder="Email">
                <label for="email" id="emailLabel">Email</label>
                </div>
            </header>
            <main>
                <section class="profile">
                    <h3>Profile</h3>
                    <input required type="text" placeholder="Describe yourself!" id="profile">
                </section>
                <section class="education">
                    <h3>Education</h3>
                    <input required type="text" placeholder="Describe your journey!" id="education">
                </section>
                <section class="experience">
                    <h3>Experience</h3>
                    <input required type="text" placeholder="Describe your work experience!" id="experience">
                </section>
            </main>
            <button type="submit">Finish</button>
        </form>
    </body>
</html>
